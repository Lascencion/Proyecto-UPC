<text x="780" y="540" font-size="15" font-weight="700" fill="#1d2433" text-anchor="start">Principios de diseño</text>
<text x="780" y="566" font-size="13" font-weight="400" fill="#5b6475" text-anchor="start">• Arquitectura por capas y cliente-servidor (SPA + API REST).</text>
<text x="780" y="587" font-size="13" font-weight="400" fill="#5b6475" text-anchor="start">• Generación aumentada por recuperación (RAG): el LLM recibe solo</text>
<text x="792" y="608" font-size="13" font-weight="400" fill="#5b6475" text-anchor="start">el contexto histórico pertinente al módulo/flujo.</text>
<text x="780" y="629" font-size="13" font-weight="400" fill="#5b6475" text-anchor="start">• Humano en el ciclo: ningún caso se usa sin revisión y aprobación.</text>
<text x="780" y="650" font-size="13" font-weight="400" fill="#5b6475" text-anchor="start">• Definición única de entidades: esquema, validación y plantillas.</text>
