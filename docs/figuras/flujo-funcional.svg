<text font-size="15" font-weight="400" fill="#1d2433" text-anchor="middle"><tspan x="610" y="185.5">Valida credenciales y</tspan><tspan x="610" y="205.0">muestra el menú según el rol</tspan></text>
<rect x="95.0" y="260.0" width="270" height="60" rx="10" fill="#e8f0fc" stroke="#1f5fbf" stroke-width="1.6"/>
<text font-size="15" font-weight="400" fill="#1d2433" text-anchor="middle"><tspan x="230" y="285.5">Registra información histórica</tspan><tspan x="230" y="305.0">(individual o masiva)</tspan></text>
<rect x="475.0" y="260.0" width="270" height="60" rx="10" fill="#f1ebfb" stroke="#6a3fb5" stroke-width="1.6"/>
<text font-size="15" font-weight="400" fill="#1d2433" text-anchor="middle"><tspan x="610" y="285.5">Valida y almacena en la</tspan><tspan x="610" y="305.0">base de conocimiento</tspan></text>
<rect x="95.0" y="360.0" width="270" height="60" rx="10" fill="#e8f0fc" stroke="#1f5fbf" stroke-width="1.6"/>
<text font-size="15" font-weight="400" fill="#1d2433" text-anchor="middle"><tspan x="230" y="385.5">Ingresa el requerimiento</tspan><tspan x="230" y="405.0">a validar</tspan></text>
<rect x="475.0" y="360.0" width="270" height="60" rx="10" fill="#f1ebfb" stroke="#6a3fb5" stroke-width="1.6"/>
<text font-size="15" font-weight="400" fill="#1d2433" text-anchor="middle"><tspan x="610" y="385.5">Recupera reglas, requerimientos</tspan><tspan x="610" y="405.0">y casos históricos similares</tspan></text>
<rect x="475.0" y="460.0" width="270" height="60" rx="10" fill="#f1ebfb" stroke="#6a3fb5" stroke-width="1.6"/>
<text font-size="15" font-weight="400" fill="#1d2433" text-anchor="middle"><tspan x="610" y="485.5">El LLM genera los casos</tspan><tspan x="610" y="505.0">de prueba funcionales</tspan></text>
<rect x="95.0" y="530.0" width="270" height="60" rx="10" fill="#e8f0fc" stroke="#1f5fbf" stroke-width="1.6"/>
<text font-size="15" font-weight="400" fill="#1d2433" text-anchor="middle"><tspan x="230" y="565.2">Revisa los casos generados</tspan></text>
<polygon points="230,623.0 305.0,665 230,707.0 155.0,665" fill="#fff" stroke="#1f5fbf" stroke-width="1.6"/>
<text font-size="14" font-weight="600" fill="#1d2433" text-anchor="middle"><tspan x="230" y="660.8">¿Son</tspan><tspan x="230" y="679.0">correctos?</tspan></text>
<rect x="95.0" y="740.0" width="270" height="60" rx="10" fill="#e8f0fc" stroke="#1f5fbf" stroke-width="1.6"/>
<text font-size="15" font-weight="400" fill="#1d2433" text-anchor="middle"><tspan x="230" y="775.2">Envía los casos a aprobación</tspan></text>
<rect x="855.0" y="740.0" width="270" height="60" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text font-size="15" font-weight="400" fill="#1d2433" text-anchor="middle"><tspan x="990" y="775.2">Revisa los casos de prueba</tspan></text>
<polygon points="990,833.0 1065.0,875 990,917.0 915.0,875" fill="#fff" stroke="#2e7d32" stroke-width="1.6"/>
<text font-size="14" font-weight="600" fill="#1d2433" text-anchor="middle"><tspan x="990" y="879.9">¿Aprueba?</tspan></text>
<rect x="475.0" y="845.0" width="270" height="60" rx="10" fill="#f1ebfb" stroke="#6a3fb5" stroke-width="1.6"/>
<text font-size="15" font-weight="400" fill="#1d2433" text-anchor="middle"><tspan x="610" y="870.5">Registra los casos aprobados</tspan><tspan x="610" y="890.0">y genera reportes</tspan></text>
<rect x="855.0" y="945.0" width="270" height="60" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text font-size="15" font-weight="400" fill="#1d2433" text-anchor="middle"><tspan x="990" y="980.2">Devuelve con observaciones</tspan></text>
