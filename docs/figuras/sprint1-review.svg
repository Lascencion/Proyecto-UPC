<text x="656" y="548" font-size="15" font-weight="700" fill="#222" text-anchor="end">9 de 9 historias completadas · 34 SP</text>
<rect x="718" y="120" width="642" height="450" fill="#f7c5c5" stroke="#e29a9a" stroke-width="1.5"/>
<text x="744" y="164" font-size="22" font-weight="700" fill="#222" text-anchor="start">02. Problemas identificados</text>
<text x="744" y="208" font-size="15.5" font-weight="700" fill="#222" text-anchor="start">Códigos ingresados manualmente</text>
<text x="744" y="231" font-size="15"><tspan fill="#c0392b">Problema: </tspan><tspan fill="#222">posibles duplicados y formatos inválidos.</tspan></text>
<text x="744" y="253" font-size="15"><tspan fill="#2f5fbf">Acción: </tspan><tspan fill="#222">asignar el código de forma automática y correlativa.</tspan></text>
<text x="744" y="296" font-size="15.5" font-weight="700" fill="#222" text-anchor="start">Trazabilidad incompleta</text>
<text x="744" y="319" font-size="15"><tspan fill="#c0392b">Problema: </tspan><tspan fill="#222">faltaba el vínculo entre requerimientos y su detalle funcional.</tspan></text>
<text x="744" y="341" font-size="15"><tspan fill="#2f5fbf">Acción: </tspan><tspan fill="#222">incorporar historias de usuario relacionadas (HU02).</tspan></text>
<text x="744" y="384" font-size="15.5" font-weight="700" fill="#222" text-anchor="start">Estructura de archivos importados</text>
<text x="744" y="407" font-size="15"><tspan fill="#c0392b">Problema: </tspan><tspan fill="#222">diferencias de separadores, codificación y columnas.</tspan></text>
<text x="744" y="429" font-size="15"><tspan fill="#2f5fbf">Acción: </tspan><tspan fill="#222">plantillas estandarizadas y validación antes de procesar.</tspan></text>
<text x="744" y="472" font-size="15.5" font-weight="700" fill="#222" text-anchor="start">Relaciones en la carga masiva</text>
<text x="744" y="495" font-size="15"><tspan fill="#c0392b">Problema: </tspan><tspan fill="#222">se perdían al asignar los códigos definitivos.</tspan></text>
<text x="744" y="517" font-size="15"><tspan fill="#2f5fbf">Acción: </tspan><tspan fill="#222">referencias temporales traducidas al confirmar la carga.</tspan></text>
<rect x="40" y="590" width="642" height="450" fill="#fbefa6" stroke="#e2cf6a" stroke-width="1.5"/>
<text x="66" y="634" font-size="22" font-weight="700" fill="#222" text-anchor="start">03. Feedback del PO</text>
<text x="66" y="678" font-size="15.5" font-weight="700" fill="#c0651b" text-anchor="start">HU01–HU05 — Registro individual</text>
<text x="66" y="701" font-size="15" font-weight="400" fill="#222" text-anchor="start">Código asignado por el sistema, fecha actual propuesta y</text>
<text x="66" y="722" font-size="15" font-weight="400" fill="#222" text-anchor="start">registros relacionados elegidos de listas.</text>
<text x="66" y="768" font-size="15.5" font-weight="700" fill="#c0651b" text-anchor="start">HU02 — Historias de usuario</text>
<text x="66" y="791" font-size="15" font-weight="400" fill="#222" text-anchor="start">Registrar historias para mayor trazabilidad con</text>
<text x="66" y="812" font-size="15" font-weight="400" fill="#222" text-anchor="start">requerimientos, reglas, casos y defectos (asesora).</text>
<text x="66" y="858" font-size="15.5" font-weight="700" fill="#c0651b" text-anchor="start">HU06–HU07 — Carga masiva</text>
<text x="66" y="881" font-size="15" font-weight="400" fill="#222" text-anchor="start">Plantillas estandarizadas; registrar solo información</text>
<text x="66" y="902" font-size="15" font-weight="400" fill="#222" text-anchor="start">nueva y mostrar el código asignado.</text>
<text x="66" y="948" font-size="15.5" font-weight="700" fill="#c0651b" text-anchor="start">HU09 — Eliminación de registros</text>
<text x="66" y="971" font-size="15" font-weight="400" fill="#222" text-anchor="start">Confirmación con el código y el título del registro,</text>
<text x="66" y="992" font-size="15" font-weight="400" fill="#222" text-anchor="start">restringida según el rol.</text>
<rect x="718" y="590" width="642" height="450" fill="#c9daf5" stroke="#8fb0e3" stroke-width="1.5"/>
<text x="744" y="634" font-size="22" font-weight="700" fill="#222" text-anchor="start">04. Acuerdos y próximos pasos</text>
<text x="744" y="678" font-size="15.5" font-weight="700" fill="#222" text-anchor="start">Seguimiento de observaciones</text>
<text x="744" y="701" font-size="15" font-weight="400" fill="#222" text-anchor="start">Los ajustes solicitados se aplicaron antes de iniciar</text>
<text x="744" y="722" font-size="15" font-weight="400" fill="#222" text-anchor="start">el Sprint 2.</text>
<text x="744" y="780" font-size="15.5" font-weight="700" fill="#222" text-anchor="start">Preparación del Sprint 2</text>
<text x="744" y="803" font-size="15" font-weight="400" fill="#222" text-anchor="start">HU10: Consulta y selección de información histórica</text>
<text x="744" y="824" font-size="15" font-weight="400" fill="#222" text-anchor="start">relacionada.</text>
<text x="744" y="845" font-size="15" font-weight="400" fill="#222" text-anchor="start">HU11: Generación de casos de prueba funcionales mediante LLM.</text>
<text x="744" y="903" font-size="15.5" font-weight="700" fill="#222" text-anchor="start">Registro de acuerdos</text>
<text x="744" y="926" font-size="15" font-weight="400" fill="#222" text-anchor="start">Documentar responsables y compromisos en el acta de</text>
<text x="744" y="947" font-size="15" font-weight="400" fill="#222" text-anchor="start">la Sprint Review.</text>
</svg>