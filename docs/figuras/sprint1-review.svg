<circle cx="74" cy="270" r="3.5" fill="#222"/>
<text x="88" y="276" font-size="15" font-weight="400" fill="#222" text-anchor="start">HU02 · Registro de historias de usuario</text>
<text x="100" y="299" font-size="15" font-weight="700" fill="#2f5fbf" text-anchor="start" font-style="italic">Estado: Completado</text>
