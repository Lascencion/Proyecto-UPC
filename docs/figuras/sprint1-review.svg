<text x="66" y="164" font-size="22" font-weight="700" fill="#222" text-anchor="start">01. Historias de usuario</text>
<circle cx="74" cy="204" r="3.5" fill="#222"/>
<text x="88" y="210" font-size="15" font-weight="400" fill="#222" text-anchor="start">HU01 · Registro de requerimientos</text>
