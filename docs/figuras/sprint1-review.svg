<text x="418" y="276" font-size="15" font-weight="400" fill="#222" text-anchor="start">HU07 · Revisión y confirmación</text>
<text x="430" y="299" font-size="15" font-weight="700" fill="#2f5fbf" text-anchor="start" font-style="italic">Estado: Completado</text>
<circle cx="404" cy="336" r="3.5" fill="#222"/>
