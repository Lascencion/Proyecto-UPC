<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="1400" height="980" fill="#fff" stroke="#333"/>
<text x="700.0" y="62" font-size="20" font-weight="700" fill="#222" text-anchor="middle">SPRINT RETROSPECTIVE – SPRINT 2</text>
<rect x="60" y="110" width="610" height="390" fill="#b4ecc8" stroke="#8fd6a8" stroke-width="1.5"/>
<text x="90" y="162" font-size="26" font-weight="700" fill="#1e7f3b" text-anchor="start">START — Empezar</text>
<circle cx="112" cy="216" r="3" fill="#333"/>
<text x="128" y="222" font-size="18" font-weight="400" fill="#222" text-anchor="start">Revisar la relevancia del contexto antes de generar</text>
<text x="128" y="248" font-size="18" font-weight="400" fill="#222" text-anchor="start">los casos.</text>
<circle cx="112" cy="286" r="3" fill="#333"/>
<text x="128" y="292" font-size="18" font-weight="400" fill="#222" text-anchor="start">Probar la generación con el modelo real y con el</text>
<text x="128" y="318" font-size="18" font-weight="400" fill="#222" text-anchor="start">modo simulado.</text>
<circle cx="112" cy="356" r="3" fill="#333"/>
<text x="128" y="362" font-size="18" font-weight="400" fill="#222" text-anchor="start">Revisar los avances con el PO y la asesora a mitad</text>
<text x="128" y="388" font-size="18" font-weight="400" fill="#222" text-anchor="start">del sprint.</text>
<rect x="730" y="110" width="610" height="390" fill="#f8c7c7" stroke="#e8a3a3" stroke-width="1.5"/>
<text x="760" y="162" font-size="26" font-weight="700" fill="#c0141c" text-anchor="start">STOP — Dejar de hacer</text>
<circle cx="782" cy="216" r="3" fill="#333"/>
<text x="798" y="222" font-size="18" font-weight="400" fill="#222" text-anchor="start">Ajustar las instrucciones del LLM sin registrar los</text>
<text x="798" y="248" font-size="18" font-weight="400" fill="#222" text-anchor="start">cambios.</text>
<circle cx="782" cy="286" r="3" fill="#333"/>
<text x="798" y="292" font-size="18" font-weight="400" fill="#222" text-anchor="start">Dejar el manejo de errores del LLM para el final.</text>
<circle cx="782" cy="330" r="3" fill="#333"/>
<text x="798" y="336" font-size="18" font-weight="400" fill="#222" text-anchor="start">Acumular tareas sin actualizar su estado en Jira.</text>
<rect x="60" y="530" width="610" height="390" fill="#c9daf9" stroke="#a5c0ee" stroke-width="1.5"/>
<text x="90" y="582" font-size="26" font-weight="700" fill="#2f5fbf" text-anchor="start">CONTINUE — Mantener</text>
<circle cx="112" cy="636" r="3" fill="#333"/>
<text x="128" y="642" font-size="18" font-weight="400" fill="#222" text-anchor="start">Realizar reuniones diarias de seguimiento.</text>
<circle cx="112" cy="680" r="3" fill="#333"/>
<text x="128" y="686" font-size="18" font-weight="400" fill="#222" text-anchor="start">Validar la respuesta del LLM con el esquema JSON.</text>
<circle cx="112" cy="724" r="3" fill="#333"/>
<text x="128" y="730" font-size="18" font-weight="400" fill="#222" text-anchor="start">Mantener la trazabilidad entre el contexto y los</text>
<text x="128" y="756" font-size="18" font-weight="400" fill="#222" text-anchor="start">casos generados.</text>
<rect x="730" y="530" width="610" height="390" fill="#dcd6fb" stroke="#bdb3f2" stroke-width="1.5"/>
<text x="760" y="582" font-size="26" font-weight="700" fill="#6a3fd1" text-anchor="start">LEARN — Aprendizajes</text>
<circle cx="782" cy="636" r="3" fill="#333"/>
<text x="798" y="642" font-size="18" font-weight="400" fill="#222" text-anchor="start">Los vínculos directos aportan un contexto más</text>
<text x="798" y="668" font-size="18" font-weight="400" fill="#222" text-anchor="start">pertinente que la similitud.</text>
<circle cx="782" cy="706" r="3" fill="#333"/>
<text x="798" y="712" font-size="18" font-weight="400" fill="#222" text-anchor="start">La salida estructurada reduce las respuestas</text>
<text x="798" y="738" font-size="18" font-weight="400" fill="#222" text-anchor="start">incompletas del LLM.</text>
<circle cx="782" cy="776" r="3" fill="#333"/>
<text x="798" y="782" font-size="18" font-weight="400" fill="#222" text-anchor="start">Separar los tipos de escenario de las técnicas evita</text>
<text x="798" y="808" font-size="18" font-weight="400" fill="#222" text-anchor="start">clasificaciones redundantes.</text>
</svg>