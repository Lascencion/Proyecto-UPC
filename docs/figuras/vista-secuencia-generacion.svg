<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5262"/></marker><marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#4a5262" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="1200" fill="#ffffff"/>
<text x="800.0" y="40" font-size="26" font-weight="800" fill="#1d2433" text-anchor="middle">Diagrama de secuencia: generación y aprobación de casos de prueba</text>
<text x="800.0" y="66" font-size="15" font-weight="400" fill="#5b6475" text-anchor="middle">Escenario principal (HU-04 a HU-09) — notación UML</text>
<circle cx="100" cy="101" r="11" fill="#ffffff" stroke="#4a5262" stroke-width="1.8" fill="none"/>
<path d="M100,112 L100,136 M83,120 L117,120 M100,136 L86,156 M100,136 L114,156" stroke="#4a5262" stroke-width="1.8" fill="none"/>
<text x="100" y="174" font-size="13.5" font-weight="700" fill="#1d2433" text-anchor="middle">Analista QA</text>
<line x1="100" y1="187" x2="100" y2="1140" stroke="#9aa3b2" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="218" y="115" width="164" height="52" fill="#d4d6da" stroke="#4a5262" stroke-width="1.3"/>
<text x="300" y="146" font-size="13.5" font-weight="700" fill="#1d2433" text-anchor="middle">Aplicación web</text>
<line x1="300" y1="167" x2="300" y2="1140" stroke="#9aa3b2" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="418" y="115" width="164" height="52" fill="#cfe8b8" stroke="#4a5262" stroke-width="1.3"/>
<text x="500" y="146" font-size="13.5" font-weight="700" fill="#1d2433" text-anchor="middle">Servicio de generación</text>
<line x1="500" y1="167" x2="500" y2="1140" stroke="#9aa3b2" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="618" y="115" width="164" height="52" fill="#cfe8b8" stroke="#4a5262" stroke-width="1.3"/>
<text x="700" y="146" font-size="13.5" font-weight="700" fill="#1d2433" text-anchor="middle">Recuperador (RAG)</text>
<line x1="700" y1="167" x2="700" y2="1140" stroke="#9aa3b2" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="818" y="115" width="164" height="52" fill="#f6d3e0" stroke="#4a5262" stroke-width="1.3"/>
<text x="900" y="146" font-size="13.5" font-weight="700" fill="#1d2433" text-anchor="middle">Base de datos</text>
<line x1="900" y1="167" x2="900" y2="1140" stroke="#9aa3b2" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="1018" y="115" width="164" height="52" fill="#cfe8b8" stroke="#4a5262" stroke-width="1.3"/>
<text x="1100" y="146" font-size="13.5" font-weight="700" fill="#1d2433" text-anchor="middle">Cliente LLM</text>
<line x1="1100" y1="167" x2="1100" y2="1140" stroke="#9aa3b2" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="1218" y="115" width="164" height="52" fill="#e3d7f5" stroke="#4a5262" stroke-width="1.3"/>
<text x="1300" y="146" font-size="13.5" font-weight="700" fill="#1d2433" text-anchor="middle">Proveedor LLM</text>
<line x1="1300" y1="167" x2="1300" y2="1140" stroke="#9aa3b2" stroke-width="1.2" stroke-dasharray="5 5"/>
<circle cx="1500" cy="101" r="11" fill="#ffffff" stroke="#4a5262" stroke-width="1.8" fill="none"/>
<path d="M1500,112 L1500,136 M1483,120 L1517,120 M1500,136 L1486,156 M1500,136 L1514,156" stroke="#4a5262" stroke-width="1.8" fill="none"/>
<text x="1500" y="174" font-size="13.5" font-weight="700" fill="#1d2433" text-anchor="middle">Líder QA</text>
<line x1="1500" y1="187" x2="1500" y2="1140" stroke="#9aa3b2" stroke-width="1.2" stroke-dasharray="5 5"/>
<line x1="100" y1="235" x2="296" y2="235" stroke="#4a5262" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="32.849999999999994" y="215" width="334.3" height="15" fill="#ffffff" opacity="0.92"/>
<text x="200.0" y="227" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="middle">1. Selecciona proyecto, módulo y registros base</text>
<line x1="300" y1="283" x2="496" y2="283" stroke="#4a5262" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="308.75" y="263" width="182.5" height="15" fill="#ffffff" opacity="0.92"/>
<text x="400.0" y="275" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="middle">2. POST /generation (JWT)</text>
<path d="M500,331 L540,331 L540,351 L504,351" fill="none" stroke="#4a5262" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="548" y="345" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="start">3. Verifica permiso GENERATION:CREATE</text>
<line x1="500" y1="383" x2="696" y2="383" stroke="#4a5262" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="491.5" y="363" width="217.0" height="15" fill="#ffffff" opacity="0.92"/>
<text x="600.0" y="375" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="middle">4. Obtener contexto del módulo</text>
<line x1="700" y1="431" x2="896" y2="431" stroke="#4a5262" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="650.1" y="411" width="299.8" height="15" fill="#ffffff" opacity="0.92"/>
<text x="800.0" y="423" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="middle">5. Consulta REQ, RN, CP y DEF relacionados</text>
<line x1="900" y1="479" x2="704" y2="479" stroke="#4a5262" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/>
<rect x="753.6" y="459" width="92.80000000000001" height="15" fill="#ffffff" opacity="0.92"/>
<text x="800.0" y="471" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="middle">6. Registros</text>
<line x1="700" y1="527" x2="504" y2="527" stroke="#4a5262" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/>
<rect x="453.54999999999995" y="507" width="292.90000000000003" height="15" fill="#ffffff" opacity="0.92"/>
<text x="600.0" y="519" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="middle">7. Contexto priorizado (límite de tokens)</text>
<path d="M500,575 L540,575 L540,595 L504,595" fill="none" stroke="#4a5262" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="548" y="589" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="start">8. Construye prompt (plantilla + contexto + esquema JSON)</text>
<line x1="500" y1="627" x2="1096" y2="627" stroke="#4a5262" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="732.9" y="607" width="134.2" height="15" fill="#ffffff" opacity="0.92"/>
<text x="800.0" y="619" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="middle">9. generar(prompt)</text>
<line x1="1100" y1="675" x2="1296" y2="675" stroke="#4a5262" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="1094.95" y="655" width="210.10000000000002" height="15" fill="#ffffff" opacity="0.92"/>
<text x="1200.0" y="667" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="middle">10. Llamada HTTPS con API key</text>
<line x1="1300" y1="723" x2="1104" y2="723" stroke="#4a5262" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/>
<rect x="1126.0" y="703" width="148.0" height="15" fill="#ffffff" opacity="0.92"/>
<text x="1200.0" y="715" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="middle">11. Respuesta (JSON)</text>
<line x1="1100" y1="771" x2="504" y2="771" stroke="#4a5262" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/>
<rect x="667.35" y="751" width="265.3" height="15" fill="#ffffff" opacity="0.92"/>
<text x="800.0" y="763" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="middle">12. Casos validados contra el esquema</text>
<line x1="500" y1="819" x2="896" y2="819" stroke="#4a5262" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="539.75" y="799" width="320.5" height="15" fill="#ffffff" opacity="0.92"/>
<text x="700.0" y="811" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="middle">13. Guarda casos (versión 1, estado BORRADOR)</text>
<line x1="500" y1="867" x2="304" y2="867" stroke="#4a5262" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/>
<rect x="329.45" y="847" width="141.1" height="15" fill="#ffffff" opacity="0.92"/>
<text x="400.0" y="859" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="middle">14. Casos generados</text>
<line x1="40" y1="901" x2="1560" y2="901" stroke="#cbd5e1" stroke-width="1"/>
<text x="1550" y="895" font-size="12" font-weight="700" fill="#5b6475" text-anchor="end">Revisión y aprobación</text>
<line x1="100" y1="937" x2="296" y2="937" stroke="#4a5262" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="19.049999999999983" y="917" width="361.90000000000003" height="15" fill="#ffffff" opacity="0.92"/>
<text x="200.0" y="929" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="middle">15. Revisa, edita u observa → regenera (pasos 2–14)</text>
<line x1="300" y1="985" x2="496" y2="985" stroke="#4a5262" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="267.35" y="965" width="265.3" height="15" fill="#ffffff" opacity="0.92"/>
<text x="400.0" y="977" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="middle">16. Enviar a aprobación (EN_REVISIÓN)</text>
<line x1="1500" y1="1033" x2="304" y2="1033" stroke="#4a5262" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="757.0" y="1013" width="286.0" height="15" fill="#ffffff" opacity="0.92"/>
<text x="900.0" y="1025" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="middle">17. Aprueba o devuelve con observaciones</text>
<line x1="300" y1="1081" x2="496" y2="1081" stroke="#4a5262" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="263.9" y="1061" width="272.2" height="15" fill="#ffffff" opacity="0.92"/>
<text x="400.0" y="1073" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="middle">18. PATCH estado (APROBADO / DEVUELTO)</text>
<line x1="500" y1="1129" x2="896" y2="1129" stroke="#4a5262" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="532.85" y="1109" width="334.3" height="15" fill="#ffffff" opacity="0.92"/>
<text x="700.0" y="1121" font-size="12.5" font-weight="400" fill="#1d2433" text-anchor="middle">19. Guarda estado, autor y fecha (trazabilidad)</text>
<text x="800.0" y="1178" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="middle">Las flechas punteadas son respuestas. Si el proveedor LLM falla o excede el tiempo límite, el Cliente LLM reintenta y la API informa el error sin perder la solicitud.</text>
</svg>