server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 110m;

  # API del backend
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }

  # Rutas de la SPA de Angular
  location / {
    try_files $uri $uri/ /index.html;
  }
}
